pillars:
  eyebrow: Pourquoi le bois
  title: Cinq atouts d'un matériau vivant
  intro: "Le bois est considéré comme un matériau durable parce qu'il est renouvelable, qu'il stocke du carbone et qu'il peut demander moins d'énergie à produire que des matériaux comme l'acier ou l'aluminium. Ses bénéfices environnementaux dépendent toutefois de la manière dont le bois est obtenu, transformé et utilisé."
  items:
    - title: Ressource renouvelable
      text: "Les arbres peuvent repousser après la récolte. Lorsque les forêts sont gérées de façon responsable, le bois peut être produit en continu sans épuiser durablement la ressource."
    - title: Stockage du carbone
      text: "Les arbres absorbent du CO₂ en grandissant et stockent du carbone dans leur bois. Un cadre de vélo en bois conserve une partie de ce carbone pendant toute sa durée de vie."
    - title: Émissions de production potentiellement plus faibles
      text: "Travailler et façonner le bois peut demander moins d'énergie que produire de l'aluminium primaire ou de l'acier, même si les colles, les finitions et les méthodes de fabrication influencent la comparaison."
    - title: Durabilité et réparabilité
      text: "Des cadres en bois bien conçus et protégés peuvent durer longtemps. Un vélo durable et réparable limite le besoin de le remplacer."
    - title: Approvisionnement local responsable
      text: "Un bois d'origine locale, certifié FSC ou PEFC, peut soutenir une gestion forestière responsable et réduire les émissions liées au transport."

quote:
  eyebrow: Biophilie
  wordsHtml: "<b>bio</b> — vie, <b>philie</b> — amitié. Être proche de la vie naturelle."
  definition: "La biophilie est la tendance innée de l'être humain à rechercher le lien avec la nature et les autres êtres vivants."

