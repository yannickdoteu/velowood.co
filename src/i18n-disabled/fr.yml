privacy:
  title: Note de confidentialité
  metaDescription: "Ce que collecte le formulaire de contact velowood, combien de temps nous le conservons et comment demander sa suppression."
  back: Retour à l'accueil
  intro: "Ce site ne dépose aucun cookie et n'utilise aucun outil d'analyse. Nous ne traitons des données personnelles que lorsque vous nous envoyez un message avec le formulaire de contact."
  sections:
    - heading: Ce que collecte le formulaire
      text: "Votre nom, votre adresse e-mail, le type de contact que vous choisissez, votre message et la langue de la page. Nous les utilisons uniquement pour répondre à votre message."
    - heading: Combien de temps nous le conservons
      text: "Votre message est conservé 180 jours, puis supprimé automatiquement. Il est aussi envoyé par e-mail à notre équipe, qui peut garder la conversation tant qu'elle est utile pour vous répondre."
    - heading: Protection contre le spam
      text: "Pour bloquer le spam automatisé, le formulaire utilise Cloudflare Turnstile. Il ne se charge que lorsque vous atteignez le formulaire. Pour cette vérification, Cloudflare traite des données techniques sur votre navigateur et votre connexion, comme votre adresse IP."
    - heading: Où les données sont traitées
      text: "Le site et le formulaire fonctionnent sur Cloudflare. Les messages sont stockés dans une base de données Cloudflare D1 et nous sont transmis par Cloudflare Email Routing."
    - heading: Vos droits
      text: "Vous pouvez demander à tout moment à consulter, corriger ou supprimer vos données. Écrivez-nous à steph@velowood.co et nous reviendrons vers vous très vite."
  controller: "velowood, Paradijsstraat 15, 2000 Anvers, Belgique"
  controllerLabel: Responsable de vos données
  updated: "Dernière mise à jour : novembre 2026"

