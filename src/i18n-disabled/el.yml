privacy:
  title: Σημείωση απορρήτου
  metaDescription: "Τι συλλέγει η φόρμα επικοινωνίας της velowood, για πόσο καιρό το φυλάσσουμε και πώς μπορείτε να ζητήσετε διαγραφή."
  back: Επιστροφή στην αρχική σελίδα
  intro: "Αυτός ο ιστότοπος δεν ορίζει cookies και δεν χρησιμοποιεί analytics. Επεξεργαζόμαστε προσωπικά δεδομένα μόνο όταν μας στέλνετε μήνυμα με τη φόρμα επικοινωνίας."
  sections:
    - heading: Τι συλλέγει η φόρμα
      text: "Το όνομά σας, τη διεύθυνση email σας, τον τύπο επικοινωνίας που επιλέγετε, το μήνυμά σας και τη γλώσσα της σελίδας. Τα χρησιμοποιούμε μόνο για να απαντήσουμε στο μήνυμά σας."
    - heading: Για πόσο καιρό το φυλάσσουμε
      text: "Το μήνυμά σας αποθηκεύεται για 180 ημέρες και στη συνέχεια διαγράφεται αυτόματα. Αποστέλλεται επίσης με email στην ομάδα μας, η οποία μπορεί να κρατήσει τη συνομιλία όσο είναι χρήσιμο για να σας απαντήσει."
    - heading: Προστασία από spam
      text: "Για να αποκλείσει το αυτοματοποιημένο spam, η φόρμα χρησιμοποιεί το Cloudflare Turnstile. Φορτώνει μόνο όταν φτάσετε στη φόρμα. Για αυτόν τον έλεγχο, η Cloudflare επεξεργάζεται τεχνικά δεδομένα για το πρόγραμμα περιήγησης και τη σύνδεσή σας, όπως τη διεύθυνση IP σας."
    - heading: Πού επεξεργάζονται τα δεδομένα
      text: "Ο ιστότοπος και η φόρμα λειτουργούν στη Cloudflare. Τα μηνύματα αποθηκεύονται σε βάση δεδομένων Cloudflare D1 και μας παραδίδονται μέσω του Cloudflare Email Routing."
    - heading: Τα δικαιώματά σας
      text: "Μπορείτε να ζητήσετε ανά πάσα στιγμή να δείτε, να διορθώσετε ή να διαγράψετε τα δεδομένα σας. Στείλτε μας email στο steph@velowood.co και θα επικοινωνήσουμε σύντομα μαζί σας."
  controller: "velowood, Paradijsstraat 15, 2000 Αμβέρσα, Βέλγιο"
  controllerLabel: Υπεύθυνος για τα δεδομένα σας
  updated: "Τελευταία ενημέρωση: Νοέμβριος 2026"

