  wordsHtml: "<b>βίος</b> — ζωή, <b>φιλία</b> — αγάπη. Να είσαι κοντά στη φυσική ζωή."
  definition: "Η βιοφιλία είναι η έμφυτη ανθρώπινη τάση να αναζητά σύνδεση με τη φύση και με άλλα ζωντανά όντα."

