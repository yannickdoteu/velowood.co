pillars:
  eyebrow: Γιατί ξύλο
  title: Πέντε πλεονεκτήματα ενός ζωντανού υλικού
  intro: "Το ξύλο θεωρείται βιώσιμο υλικό επειδή είναι ανανεώσιμο, αποθηκεύει άνθρακα και μπορεί να απαιτεί λιγότερη ενέργεια για την παραγωγή του σε σχέση με υλικά όπως ο χάλυβας ή το αλουμίνιο. Ωστόσο, τα περιβαλλοντικά του οφέλη εξαρτώνται από το πώς προμηθεύεται, επεξεργάζεται και χρησιμοποιείται το ξύλο."
  items:
    - title: Ανανεώσιμος πόρος
      text: "Τα δέντρα μπορούν να αναπτυχθούν ξανά μετά τη συγκομιδή. Όταν τα δάση διαχειρίζονται υπεύθυνα, το ξύλο μπορεί να παράγεται συνεχώς χωρίς να εξαντλείται μόνιμα ο πόρος."
    - title: Αποθήκευση άνθρακα
      text: "Τα δέντρα απορροφούν CO₂ καθώς μεγαλώνουν και αποθηκεύουν άνθρακα στο ξύλο τους. Ένα ξύλινο πλαίσιο ποδηλάτου διατηρεί μέρος αυτού του άνθρακα σε όλη τη διάρκεια ζωής του."
    - title: Δυνητικά χαμηλότερες εκπομπές παραγωγής
      text: "Η επεξεργασία και η διαμόρφωση του ξύλου μπορεί να απαιτεί λιγότερη ενέργεια από την παραγωγή πρωτογενούς αλουμινίου ή χάλυβα, αν και οι κόλλες, οι επιστρώσεις και οι μέθοδοι κατασκευής επηρεάζουν τη σύγκριση."
    - title: Αντοχή και δυνατότητα επισκευής
      text: "Τα σωστά σχεδιασμένα και προστατευμένα ξύλινα πλαίσια μπορούν να αντέξουν πολλά χρόνια. Ένα ανθεκτικό ποδήλατο που επισκευάζεται μειώνει την ανάγκη αντικατάστασης."
    - title: Υπεύθυνη τοπική προμήθεια
      text: "Η χρήση τοπικής ξυλείας με πιστοποίηση FSC ή PEFC μπορεί να στηρίξει την υπεύθυνη δασοκομία και να μειώσει τις εκπομπές από τις μεταφορές."

quote:
