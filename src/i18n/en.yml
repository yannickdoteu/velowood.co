privacy:
  title: Privacy note
  metaDescription: "What the velowood contact form collects, how long we keep it and how to ask for deletion."
  back: Back to the home page
  intro: "This website sets no cookies and uses no analytics. We only process personal data when you send us a message with the contact form."
  sections:
    - heading: What the form collects
      text: "Your name, your email address, the type of contact you choose, your message and the language of the page. We use them only to answer your message."
    - heading: How long we keep it
      text: "Your message is stored for 180 days, then deleted automatically. It is also sent by email to our team, who may keep the conversation while it is useful to answer you."
    - heading: Protection against spam
      text: "To block automated spam, the form uses Cloudflare Turnstile. It loads only when you reach the form. For this check, Cloudflare processes technical data about your browser and connection, such as your IP address."
    - heading: Where the data is processed
      text: "The website and the form run on Cloudflare. Messages are stored in a Cloudflare D1 database and delivered to us by Cloudflare Email Routing."
    - heading: Your rights
      text: "You can ask to see, correct or delete your data at any time. Email us at steph@velowood.co and we will reply within a few days."
  controller: "velowood, Paradijsstraat 15, 2000 Antwerpen, Belgium"
  controllerLabel: Responsible for your data
  updated: "Last updated: November 2026"

