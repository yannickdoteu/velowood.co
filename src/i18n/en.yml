pillars:
  eyebrow: Why wood
  title: Five advantages of a living material
  intro: "Wood is considered a sustainable material because it is renewable, stores carbon, and can require less energy to produce than materials such as steel or aluminium. However, its environmental benefits depend on how the wood is sourced, processed, and used."
  items:
    - title: Renewable resource
      text: "Trees can regrow after harvesting. When forests are responsibly managed, wood can be produced continuously without permanently depleting the resource."
    - title: Carbon storage
      text: "Trees absorb CO₂ during growth and store carbon in their wood. A wooden bicycle frame retains some of that carbon throughout its lifetime."
    - title: Potentially lower production emissions
      text: "Processing and shaping wood can require less energy than producing primary aluminium or steel, although adhesives, coatings and manufacturing methods affect the comparison."
    - title: Durability and repairability
      text: "Properly engineered and protected wooden frames can be durable. A long-lasting, repairable bicycle reduces the need for replacement."
    - title: Responsible local sourcing
      text: "Using locally sourced, FSC- or PEFC-certified timber can support responsible forestry and reduce transport-related emissions."

quote:
  eyebrow: Biophilia
  wordsHtml: "<b>bio</b> — life, <b>philia</b> — friendship. To be close to natural life."
  definition: "Biophilia is the innate human tendency to seek connections with nature and other living things."

