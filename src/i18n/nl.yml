privacy:
  title: Privacyverklaring
  metaDescription: "Wat het velowood-contactformulier verzamelt, hoe lang we het bewaren en hoe u om verwijdering kunt vragen."
  back: Terug naar de startpagina
  intro: "Deze website plaatst geen cookies en gebruikt geen analyse. We verwerken alleen persoonsgegevens wanneer u ons een bericht stuurt via het contactformulier."
  sections:
    - heading: Wat het formulier verzamelt
      text: "Uw naam, uw e-mailadres, het soort contact dat u kiest, uw bericht en de taal van de pagina. We gebruiken ze alleen om uw bericht te beantwoorden."
    - heading: Hoe lang we het bewaren
      text: "Uw bericht wordt 180 dagen bewaard en daarna automatisch verwijderd. Het wordt ook per e-mail naar ons team gestuurd, dat het gesprek kan bewaren zolang dat nuttig is om u te antwoorden."
    - heading: Bescherming tegen spam
      text: "Om geautomatiseerde spam te blokkeren gebruikt het formulier Cloudflare Turnstile. Het wordt pas geladen wanneer u het formulier bereikt. Voor deze controle verwerkt Cloudflare technische gegevens over uw browser en verbinding, zoals uw IP-adres."
    - heading: Waar de gegevens worden verwerkt
      text: "De website en het formulier draaien op Cloudflare. Berichten worden bewaard in een Cloudflare D1-database en bij ons bezorgd via Cloudflare Email Routing."
    - heading: Uw rechten
      text: "U kunt op elk moment vragen om uw gegevens in te zien, te verbeteren of te verwijderen. Mail ons op steph@velowood.co en we antwoorden binnen enkele dagen."
  controller: "velowood, Paradijsstraat 15, 2000 Antwerpen, België"
  controllerLabel: Verantwoordelijke voor uw gegevens
  updated: "Laatst bijgewerkt: november 2026"

