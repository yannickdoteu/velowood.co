hero:
  eyebrow: Houten fietsen
  titleHtml: "Fiets dicht bij het <em>natuurlijke</em> leven."
  lead: "Fietsen met frames die met de hand uit hout worden gevormd, in onze werkplaats in Griekenland. Gevestigd in België."
  cta: Neem contact op
  imageAlt: "Een vakman in de velowood-werkplaats kiest een gebogen houten framedeel voor een wand vol mallen"

pillars:
  eyebrow: Waarom hout
  title: Vijf voordelen van een levend materiaal
  intro: "Hout wordt beschouwd als een duurzaam materiaal omdat het hernieuwbaar is, koolstof opslaat en minder energie kan vragen om te produceren dan materialen zoals staal of aluminium. De milieuvoordelen hangen echter af van hoe het hout wordt gewonnen, verwerkt en gebruikt."
  items:
    - title: Hernieuwbare grondstof
      text: "Bomen kunnen na de oogst opnieuw groeien. Wanneer bossen verantwoord worden beheerd, kan hout continu worden geproduceerd zonder de grondstof blijvend uit te putten."
    - title: Koolstofopslag
      text: "Bomen nemen tijdens hun groei CO₂ op en slaan koolstof op in hun hout. Een houten fietsframe houdt een deel van die koolstof vast gedurende zijn hele levensduur."
    - title: Mogelijk lagere uitstoot bij de productie
      text: "Hout bewerken en vormen kan minder energie vragen dan de productie van primair aluminium of staal, al hebben lijmen, coatings en productiemethoden invloed op de vergelijking."
    - title: Duurzaamheid en herstelbaarheid
      text: "Goed ontworpen en beschermde houten frames kunnen lang meegaan. Een duurzame, herstelbare fiets verkleint de behoefte aan vervanging."
    - title: Verantwoorde lokale herkomst
      text: "Lokaal verkregen hout met FSC- of PEFC-certificering kan verantwoord bosbeheer ondersteunen en de uitstoot door transport verminderen."

quote:
  eyebrow: Biofilie
  wordsHtml: "<b>bio</b> — leven, <b>filia</b> — vriendschap. Dicht bij het natuurlijke leven zijn."
  definition: "Biofilie is de aangeboren menselijke neiging om verbinding te zoeken met de natuur en andere levende wezens."

